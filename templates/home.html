<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale Conigliaro</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        h1 { color: #1a73e8; margin-bottom: 30px; font-size: 24px; }
        .btn { display: block; width: 100%; padding: 15px 0; margin-bottom: 15px; text-decoration: none; color: white; border-radius: 8px; font-size: 18px; font-weight: bold; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-admin { background-color: #2e7d32; } /* Verde - Ordini */
        .btn-dash { background-color: #1976d2; }  /* Blu - Statistiche */
        .footer { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Gestionale Conigliaro</h1>
        
        <a href="/admin/" class="btn btn-admin">📦 GESTIONE & ORDINI</a>

        <a href="/dashboard/" class="btn btn-dash">📊 DASHBOARD VENDITE</a>

        <div class="footer">Server Cloud Ready ☁️</div>
    </div>
</body>
</html>
